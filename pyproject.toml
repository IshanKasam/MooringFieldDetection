[project]
name = "mooring-field-detection"
version = "0.1.0"
description = "Detect mooring fields from satellite imagery via YOLO boat detection and spatial clustering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "fiona>=1.10",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "shapely>=2.0",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mooring-parse-kml = "mooring_fields.cli:parse_kml_cmd"
mooring-fetch = "mooring_fields.cli:fetch_imagery_cmd"
mooring-prelabel = "mooring_fields.cli:prelabel_cmd"
mooring-train = "mooring_fields.cli:train_cmd"
mooring-evaluate = "mooring_fields.cli:evaluate_cmd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mooring_fields"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
