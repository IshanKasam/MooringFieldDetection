# Satellite tile acquisition settings (Maps Static API)
maptype: satellite
size: 640
scale: 2
min_zoom: 18
max_zoom: 20
default_zoom: 19

# Offset tiles (meters) from center to capture cluster extent
offsets_m:
  - 0
  - 200

offset_directions:
  - center
  - north
  - south
  - east
  - west

# Rate limiting
requests_per_second: 10
max_retries: 2
retry_backoff_seconds: 2

# Safety cap: max billable API calls per fetch run (Google free tier = 10,000/month)
max_api_requests_per_run: 800
google_free_tier_monthly: 10000
